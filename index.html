  :root {
    --paper: #f1ead6;
    --paper-deep: #e4dabe;
    --ink: #3a2e1f;
    --ink-soft: #5a4b37;
    --olive: #565c3b;
    --olive-deep: #3c4029;
    --gold: #a6803c;
    --gold-soft: #d3b36c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    min-height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'EB Garamond', Georgia, serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 6vh 1.25rem 8vh;
    line-height: 1.5;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 30rem;
  }

  .stage:not(.opened) {
    aspect-ratio: 960 / 1179;
  }

  /* ---------- Card ---------- */

  .card {
    position: relative;
    background: var(--paper-deep);
    border: 1px solid var(--olive);
    outline: 1px solid var(--gold);
    outline-offset: -6px;
    padding: 3.2rem 2rem 2.6rem;
    text-align: center;
  }

  .eyebrow {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 0.72rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--olive-deep);
    margin: 0 0 0.9rem;
  }

  .rule {
    width: 3.2rem;
    height: 1px;
    background: var(--gold);
    margin: 0.9rem auto;
  }

  .names {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2.4rem, 9vw, 3.4rem);
    line-height: 1.15;
    margin: 0.2rem 0 0.6rem;
    text-wrap: balance;
  }

  .names .amp {
    padding: 0 0.15em;
  }

  .tagline {
    font-style: italic;
    font-size: 1.05rem;
    color: var(--ink-soft);
    margin: 0 0 1.6rem;
  }

  .date-block {
    margin: 1.4rem 0 1.2rem;
  }

  .date-line {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: clamp(1.9rem, 7vw, 2.4rem);
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
    margin: 0.15rem 0;
  }

  .location {
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0.6rem 0 0;
  }

  .note {
    font-style: italic;
    font-size: 0.88rem;
    color: var(--ink-soft);
    margin: 1.6rem 0 0;
  }

  .actions {
    margin-top: 2.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }

  .action-group {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .btn-row {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 0.82rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--paper);
    background: var(--olive);
    border: 1px solid var(--olive);
    padding: 0.7rem 1.1rem;
    flex: 1 1 auto;
    min-width: 9.5rem;
    text-align: center;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .btn:hover,
  .btn:focus-visible {
    background: var(--paper-deep);
    color: var(--olive-deep);
  }

  .btn.secondary {
    background: transparent;
    color: var(--olive-deep);
  }

  .btn.secondary:hover,
  .btn.secondary:focus-visible {
    background: var(--olive);
    color: var(--paper);
  }

  .btn.rsvp {
    background: transparent;
    border-color: var(--gold);
    color: var(--gold);
    letter-spacing: 0.22em;
  }

  .btn.rsvp:hover,
  .btn.rsvp:focus-visible {
    background: var(--gold);
    color: var(--paper);
  }

  :focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .corner {
    position: absolute;
    width: 1.1rem;
    height: 1.1rem;
    border: 1px solid var(--gold);
  }
  .corner.tl { top: 0.45rem; left: 0.45rem; border-right: none; border-bottom: none; }
  .corner.tr { top: 0.45rem; right: 0.45rem; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 0.45rem; left: 0.45rem; border-right: none; border-top: none; }
  .corner.br { bottom: 0.45rem; right: 0.45rem; border-left: none; border-top: none; }

  /* ---------- Cover / seal ---------- */

  .cover {
    position: absolute;
    inset: 0;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    z-index: 5;
    overflow: hidden;
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  .cover-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  .cover-names {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: clamp(1.9rem, 7vw, 2.5rem);
    margin: 0 0 0.5rem;
  }

  .cover-names .amp {
    padding: 0 0.15em;
  }

  .cover-sub {
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 2rem;
  }

  .seal {
    width: clamp(9.5rem, 42vw, 12rem);
    aspect-ratio: 1 / 1;
    padding: 0.4rem;
    border: 1px solid var(--gold);
    border-radius: 50%;
    background: var(--paper-deep);
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 0.5rem 1.2rem rgba(60, 64, 41, 0.28);
    transition: transform 0.9s ease, opacity 0.9s ease;
    line-height: 0;
  }

  .seal img {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
  }

  .seal:hover { transform: scale(1.04); }

  .seal-hint {
    font-size: 0.66rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 1rem;
  }

  .stage.opened .cover {
    opacity: 0;
    transform: scale(1.04);
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .cover, .seal { transition: none; }
  }

  #confetti-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  @media (max-width: 400px) {
    .btn { min-width: 100%; }
  }
</style>

      'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      'UID:chaikou-layla-wedding-20270528@savethedate',
      'DTSTAMP:20260804T000000Z',
      'DTSTART;VALUE=DATE:20270528',
      'DTEND;VALUE=DATE:20270529',
      "SUMMARY:Chaikou & Layla's Wedding",
      'DESCRIPTION:Save the date! Formal invitation with time and full details to follow.',
      'LOCATION:Greencastle\\, IN',
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');

    var appleBtn = document.getElementById('apple-cal-btn');
    var icsBlob = new Blob([icsLines], { type: 'text/calendar;charset=utf-8' });
    appleBtn.href = URL.createObjectURL(icsBlob);
    appleBtn.setAttribute('download', 'Chaikou-and-Layla-Wedding.ics');

    var googleParams = new URLSearchParams({
      action: 'TEMPLATE',
      text: "Chaikou & Layla's Wedding",
      dates: '20270528/20270529',
      details: 'Save the date! Formal invitation with time and full details to follow.',
      location: 'Greencastle, IN'
    });
    document.getElementById('google-cal-btn').href =
      'https://calendar.google.com/calendar/render?' + googleParams.toString();

    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function fireConfetti() {
      var canvas = document.getElementById('confetti-canvas');
      var ctx = canvas.getContext('2d');
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      var colors = ['#565c3b', '#a6803c', '#d3b36c', '#f1ead6', '#3c4029'];
      var count = Math.min(150, Math.floor(window.innerWidth / 5));
      var pieces = [];
      for (var i = 0; i < count; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * canvas.height * 0.6,
          w: 5 + Math.random() * 6,
          h: 9 + Math.random() * 7,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.22,
          vy: 2 + Math.random() * 2.4,
          vx: (Math.random() - 0.5) * 1.4,
          sway: Math.random() * Math.PI * 2,
          swaySpeed: 0.018 + Math.random() * 0.02,
          life: 0,
          maxLife: 260 + Math.random() * 140
        });
      }

      function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var alive = false;
        for (var j = 0; j < pieces.length; j++) {
          var p = pieces[j];
          p.life++;
          if (p.life > p.maxLife) continue;
          alive = true;
          p.sway += p.swaySpeed;
          p.x += p.vx + Math.sin(p.sway) * 0.6;
          p.y += p.vy;
          p.rot += p.vRot;
          var fade = p.life > p.maxLife - 40 ? Math.max(0, (p.maxLife - p.life) / 40) : 1;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.globalAlpha = fade;
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
        if (alive) {
          requestAnimationFrame(tick);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      tick();
    }

    document.getElementById('seal-btn').addEventListener('click', function () {
      document.getElementById('stage').classList.add('opened');
      if (!reduceMotion) fireConfetti();
    });
  })();
</script>
